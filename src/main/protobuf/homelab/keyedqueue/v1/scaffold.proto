// SCAFFOLDING — delete when the real contract is written.
// It exists so the build proves the whole toolchain end to end: protoc runs, ScalaPB generates messages,
// zio-grpc generates the ZIO server trait and client, and all of it compiles under the strict flags.
syntax = "proto3";

package homelab.keyedqueue.v1;

import "scalapb/scalapb.proto";

// flat_package drops the file-name subpackage, so types land in `homelab.keyedqueue.v1` rather than
// `homelab.keyedqueue.v1.scaffold`. Set here rather than in build.sbt so ScalaPB and zio-grpc agree.
option (scalapb.options) = {
  flat_package: true
};

message PingRequest {
  string key = 1;
}

message PingReply {
  string key = 1;
}

service Scaffold {
  rpc Ping(PingRequest) returns (PingReply);
}
