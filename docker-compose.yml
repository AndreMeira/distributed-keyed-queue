# Local Redis for the POC, mirroring what the cluster will run (see docs/research/roadmap.md §1):
# one instance, no persistence, eviction OFF.
#
# Valkey rather than Redis: same commands (BLMOVE, ZADD, Lua, ACLs), BSD-licensed under the
# Linux Foundation, and — since Broadcom moved the free Bitnami images to an unmaintained
# `bitnamilegacy` repo — the one with freely available images and charts.
services:
  redis:
    image: valkey/valkey:8.1-alpine # pin the minor; keep aligned with whatever the cluster runs
    container_name: dkq-redis
    ports:
      - "6379:6379"
    command:
      # noeviction is not a preference: any eviction policy silently deletes queued jobs when
      # memory fills, which is the worst failure this system can have.
      - valkey-server
      - --maxmemory-policy
      - noeviction
      # `save ""` + `appendonly no`: nothing survives a restart, deliberately. The POC proves
      # semantics, not durability — persistence is phase 3 (docs/research/roadmap.md).
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Observability, opt-in ────────────────────────────────────────────────────────────────────────
  # Behind a profile, so `docker compose up` is still just Valkey and nothing here costs a developer who
  # is not looking at telemetry. Start it with:
  #
  #   docker compose --profile telemetry up -d
  #
  # Nothing sends to it by default: `sbt run` has no agent at all (it is scoped `dist`, so only the image
  # carries it), and the image keeps OTEL_JAVAAGENT_ENABLED=false. `bin/run-with-telemetry.sh` is the one
  # thing that turns both on.
  jaeger:
    image: jaegertracing/jaeger:2.0.0
    container_name: dkq-jaeger
    profiles: [telemetry]
    command: ["--config=/etc/jaeger/jaeger.yml"]
    volumes:
      - ./data/jaeger/jaeger.yml:/etc/jaeger/jaeger.yml:ro
    ports:
      - "16686:16686" # Jaeger UI — the traces
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP, the agent's default
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: dkq-prometheus
    profiles: [telemetry]
    volumes:
      - ./data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Prometheus UI — the metrics, and where to try a query before writing a panel
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: dkq-grafana
    profiles: [telemetry]
    volumes:
      - ./data/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000" # Grafana UI — admin/admin, with both datasources already provisioned
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on: [prometheus]
    restart: unless-stopped

# No `app` service here on purpose: this stack is the substrate for a dkq you run from sbt or your IDE.
# For dkq *deployed* — the image, two instances, the whole thing driven over the wire — see
# docker-compose.e2e.yml and docs/architecture/end-to-end-testing.md. The image itself comes from
# `sbt Docker/publishLocal`; there is no hand-written Dockerfile.
