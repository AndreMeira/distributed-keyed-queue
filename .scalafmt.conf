version = "3.9.10"

align {
  stripMargin = true
  preset = most
}

assumeStandardLibraryStripMargin = false

binPack {
  literalArgumentLists = false
  parentConstructors = true
}

continuationIndent {
  withSiteRelativeToExtends = 2
}

includeNoParensInSelectChains = false

docstrings {
  style = keep
}

indent {
  caseSite = 2
  defnSite = 2
}

indentOperator {
  topLevelOnly = false
}

maxColumn = 150

newlines {
  alwaysBeforeElseAfterCurlyIf = true
  avoidInResultType = true
  beforeCurlyLambdaParams = multilineWithCaseOnly
  # Keep a select chain's line breaks as written, so `state.getAndSet(State.Idle).flatMap:` may stay on one
  # line; the default splits every `.call` once the chain ends in a multi-line block.
  selectChains = keep
  topLevelStatementBlankLines = [
    {
      blanks = 2
      maxNest = 0
    }
  ]
}

project {
  excludeFilters = [
    ".metals"
  ]
}

rewrite {
  rules = [
    PreferCurlyFors
    RedundantBraces
    RedundantParens
    SortModifiers
  ]
  sortModifiers {
    order = [
      final
      sealed
      abstract
      override
      implicit
      private
      protected
      lazy
    ]
  }
}

rewriteTokens {
  "⇒" = "=>"
  "→" = "->"
  "←" = "<-"
}

runner {
  dialect = scala3
}

spaces {
  inImportCurlyBraces = true
}

trailingCommas = multiple

danglingParentheses.exclude = []

verticalMultiline {
  arityThreshold = 9
  atDefnSite = true
  newlineAfterOpenParen = true
}
