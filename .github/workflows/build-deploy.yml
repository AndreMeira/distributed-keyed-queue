# On push to main, run the same suite a PR runs, then build the image and push it to GHCR.
#
# This publishes; it does not deploy, and it is not going to. dkq sits where a database or a broker sits:
# whatever runs it pins a version and moves when its operator decides to, so a merge here has no business
# moving anything. A tag write for ArgoCD to follow would be continuous deployment of shared
# infrastructure underneath everything depending on it, which is the opposite of what pinning is for.
#
# Modelled on the pattern the homelab's deployed services use, with one difference: the image is built by
# `sbt server/Docker/publish`, not docker/build-push-action. This service has no hand-written Dockerfile
# on purpose (see build.sbt) — sbt-native-packager generates it, so the image pushed here is the one
# `publishLocal` gives a developer and the one the end-to-end suite composes.
#
# Tagged with the commit SHA and `latest`: the SHA is what a manifest names, `latest` is what the compose
# files use so a developer can pull instead of build. Nothing here tags a released version, so pinning
# today means pinning a SHA — a version tag would have to come from the release workflow, which publishes
# the Maven artifacts and does not touch the image.
#
# The package is public without anyone asking for it: published from a public repository with GITHUB_TOKEN,
# so GHCR links it to the repository and it inherits that visibility. There is no API to change visibility
# if that is ever wanted — it is a setting under repo -> Packages -> the package.
#
# Credentials — the two halves are separate and must not be merged:
#   - sbt RESOLVES the homelab toolkit from another repo's Maven registry, which needs read:packages.
#   - docker PUSHES to this repo's own registry, which the built-in GITHUB_TOKEN may do given packages:write.
# They do not collide the way the Maven publish does (see release.yml): docker/login-action writes the
# daemon's credentials, sbt reads its own from the environment.
name: build-deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The exact suite a PR runs; the image is gated on it.
  test:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the image to GHCR with the built-in token
    env:
      # RELEASE_VERSION is what build.sbt reads for `version`, and therefore what tags the image. The SHA
      # is immutable, which is the property a deployment wants from a tag.
      RELEASE_VERSION: ${{ github.sha }}
      # Read credentials for sbt: the toolkit resolves from GitHub Packages, which serves Maven only to
      # authenticated callers. Same fallback as tests.yml.
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.HOMELAB_PACKAGES_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # 21 because that is what the service runs on in its image (see build.sbt, dockerBaseImage).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      # sbt is no longer preinstalled on the runner images.
      - uses: sbt/setup-sbt@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token, not the read PAT: this is a write to this repo's own registry.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes ghcr.io/andremeira/distributed-keyed-queue at both the SHA and `latest`
      # (dockerUpdateLatest in build.sbt).
      - name: Build and push the image
        run: sbt -batch -no-colors server/Docker/publish
