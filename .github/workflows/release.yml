# Publishes the contract and client modules to this repo's GitHub Packages Maven registry when a GitHub
# Release is published.
#
# The trigger is `release`, not `push: tags`, because a release created in the GitHub UI creates its tag
# internally and emits the release webhook only — a tag-filtered workflow never runs for it. So publishing
# is driven by the Release, and `workflow_dispatch` is there to re-run one by hand if a publish fails after
# the release already exists.
#
# Three artifacts go out — `protocol` (the message types), `protocol-zio-grpc` (the RPC stubs) and `client`
# (the lock in Scala types). `server` ships as a Docker image and `root`/`e2e` build nothing a consumer
# wants, so all three set `publish / skip` in build.sbt. Nothing here names the modules: `sbt publish` at
# the root publishes what has not opted out, so a new module is published by existing, not by being listed.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0'
        required: true

# `packages: write` is what lets the built-in GITHUB_TOKEN publish to this repo's own registry, so the
# publish half needs no secret of its own. Reading the toolkit is the half that does — see the Test step.
permissions:
  contents: read
  packages: write

# Two releases published back to back are two different versions, so let them run rather than cancelling.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Supplied by Actions; the token is per-step below, because the two halves of GitHub Packages want
      # different ones.
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      # Explicit ref: a manual run has no tag context of its own, and pinning it keeps both paths identical.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # 21 because that is what the service runs on in its image (see build.sbt, dockerBaseImage) — same as
      # tests.yml.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      # sbt is no longer preinstalled on the runner images.
      - uses: sbt/setup-sbt@v1

      # The suite runs here too rather than trusting the tagged commit's earlier run: a green `main` is not
      # proof that *this* tree publishes, and a GitHub Packages version cannot be overwritten once pushed.
      - name: Test
        env:
          # READING another repo's registry: `server` resolves the homelab toolkit, and GitHub Packages
          # serves Maven only to authenticated callers — there is no anonymous fetch, whatever the
          # visibility. Authorisation is the separate gate, and the toolkit's packages are PUBLIC, so any
          # authenticated identity may read them: the fallback alone has worked since the first run here.
          # The PAT is what makes this survive the toolkit going private, where a token would have to be
          # granted access explicitly.
          GITHUB_TOKEN: ${{ secrets.HOMELAB_PACKAGES_PAT || secrets.GITHUB_TOKEN }}
        run: sbt -batch -no-colors test

      # `v0.1.0` -> `0.1.0`: the tag carries the `v`, the artifact version must not. build.sbt reads this.
      - name: Derive version from tag
        run: echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Publish
        env:
          # WRITING this repo's own registry, which the built-in token may do given `packages: write`
          # above — the same arrangement the toolkit publishes under. No PAT, so a leaked or over-scoped
          # personal token is never what stands between this repo and its own artifacts.
          #
          # This step DOES resolve from the toolkit — `client` depends on `homelab-common` and publishes —
          # and the built-in token can read it because those packages are public and GitHub Packages asks
          # only that a caller be somebody. The Test step above has also already pulled it onto this
          # runner, so the cache covers a day when that stops being true. If the toolkit ever goes
          # private, this step needs the PAT the Test step uses.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt -batch -no-colors publish
