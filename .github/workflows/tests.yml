# Unit and integration tests on every pull request.
#
# The end-to-end suite is deliberately NOT run here: it builds a Docker image and composes a two-instance
# deployment, for a suite whose value is in being run before a release rather than on every commit. Its
# sources are still compiled below, so it cannot rot unnoticed. See docs/architecture/end-to-end-testing.md.
name: tests

on:
  # Pull requests only. A `push` trigger here as well ran the suite twice for every commit on a branch with
  # an open PR — once for the push, once for the PR's synchronize — and the two runs answer the same
  # question. A branch with no PR yet gets no run, which is the deliberate trade: the answer that gates a
  # merge is the one on the PR.
  pull_request:
  # build-deploy.yml gates on this, so a merge to main runs exactly the suite a PR ran.
  workflow_call:

# A second push to the same branch makes the first run's answer worthless.
#
# `github.workflow` is in the group because a called workflow reports its *caller's* name: without it a
# direct run and a call would share a group, and `cancel-in-progress` would let one kill the other — which
# for the call means `needs: test` never completes and the image never ships.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # the homelab toolkit resolves from GitHub Packages, which serves Maven only to authenticated callers

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # GitHubPackages.credentials (project/) reads these; the toolkit resolves from GitHub Packages, which
      # serves Maven only to authenticated callers — no anonymous fetch at any visibility. The toolkit's
      # packages are public, so the built-in GITHUB_TOKEN is identity enough and the fallback carries this
      # on its own. HOMELAB_PACKAGES_PAT (a classic PAT with read:packages) is one credential across every
      # homelab consumer, and the thing that keeps this working if the toolkit ever goes private.
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.HOMELAB_PACKAGES_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # 21 because that is what the service runs on in its image (see build.sbt, dockerBaseImage).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      # sbt is no longer preinstalled on the runner images.
      - uses: sbt/setup-sbt@v1

      # `Testcontainers` starts a Valkey for the store and gRPC specs; ubuntu-latest ships a Docker daemon.
      - name: Test
        run: sbt -batch test

      # Compiled, never run: it keeps the end-to-end suite honest without paying for it on every commit.
      - name: Compile the end-to-end suite
        run: sbt -batch e2e/Test/compile

      # The client is the module whose docs somebody other than us reads, and scaladoc otherwise runs once
      # a release — so a link that stopped resolving reaches a published artifact before anything says a
      # word. That happened at 0.0.5, from a package move the compiler was perfectly happy with.
      #
      # Grepped rather than made fatal because scaladoc's link warnings are not the compiler's: neither
      # `-Wconf:...:error` nor `-Xfatal-warnings` promotes them, and `doc` exits 0 with a dead link in it.
      - name: Generate the client's docs
        run: |
          set -o pipefail
          sbt -batch -no-colors client/doc | tee doc.log
          if grep -q "Couldn't resolve a member for the given link query" doc.log; then
            echo "::error::a scaladoc link in the client does not resolve"
            exit 1
          fi
