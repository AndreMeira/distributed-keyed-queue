# dkq's settings. Every key has a working default for a laptop against docker-compose.yml, and an
# environment override for anything deployed — the ${?VAR} form leaves the default in place when the
# variable is unset, so there is exactly one place to read what a setting means.

# Where the substrate lives.
redis-url = "redis://localhost:6379"
redis-url = ${?DKQ_REDIS_URL}

# Whether `redis-url` names a Redis Cluster rather than a single server. Lettuce has no URL scheme that
# tells the two apart, so it is said here. The key layout is cluster-ready either way — every key carries
# its queue's `{q:<queue>}` hash tag — but the client and the script registration differ.
cluster = false
cluster = ${?DKQ_CLUSTER}

# The port the gRPC server listens on.
port = 9000
port = ${?DKQ_PORT}

# How long a claim survives without a heartbeat. It must exceed the slowest handler a consumer will run
# without extending, or live work gets reclaimed underneath it.
lease-ttl = 30 seconds
lease-ttl = ${?DKQ_LEASE_TTL}

# How often each instance runs the repair sweeps. Every instance runs them: the sweep is idempotent, so
# no leader election and no single instance whose death stops repair.
sweep-interval = 5 seconds
sweep-interval = ${?DKQ_SWEEP_INTERVAL}

# The most entries one sweep handles per kind. A LuaScript script blocks the whole server, so a sweep is bounded
# and repeats immediately when it hits this rather than waiting for the next tick.
sweep-limit = 100
sweep-limit = ${?DKQ_SWEEP_LIMIT}

# How often each instance removes abandoned lock holds — holders that died without releasing, whose locks
# nobody asks for again. Hygiene, not liveness: a wanted lock is reclaimed inline by the next acquire.
lock-trim-interval = 120 seconds
lock-trim-interval = ${?DKQ_LOCK_TRIM_INTERVAL}

# How long past lease expiry a lock hold survives before a trim may remove it. This bounds the lock's
# "late, not lost" window: a holder may refresh late, up to this long past expiry.
lock-trim-grace = 10 minutes
lock-trim-grace = ${?DKQ_LOCK_TRIM_GRACE}

# The longest a single lock grant's lease may run; a caller asking for more is clamped to it. Reclaim of a
# crashed holder happens at lease expiry, so this bounds how long a crash can block a lock. A holder that
# needs longer refreshes.
lock-max-ttl = 10 minutes
lock-max-ttl = ${?DKQ_LOCK_MAX_TTL}

# How long the doorbell's read waits before going round again. It is not a poll: entries arrive while the
# read is parked. What it bounds is how quickly a queue this instance has only just started serving is
# added to the read in flight.
wake-block = 1 second
wake-block = ${?DKQ_WAKE_BLOCK}

# The most messages one claim may hand over at once. A batch is one claim over several of a key's messages,
# settled individually; the ceiling is here so one caller cannot decide how much a single claim withholds
# from everyone else.
max-batch-limit = 32
max-batch-limit = ${?DKQ_MAX_BATCH_LIMIT}

# The longest wait this service will honour, and the connection's command timeout. A caller asking for
# more is clamped to it.
max-wait = 30 seconds
max-wait = ${?DKQ_MAX_WAIT}

# The longest delay a schedule may ask for, the horizon. A scheduled message waits in the store's memory until
# it is due, and on a `noeviction` store full memory refuses every write; the horizon bounds how long one can
# stay, and turns a unit mistake in a producer into an immediate refusal.
max-schedule-ahead = 7 days
max-schedule-ahead = ${?DKQ_MAX_SCHEDULE_AHEAD}

# The window a request for a schedule tick is rounded up to. Entries due within one window share one pass of
# the mover, at most this late; it also caps the mover at one pass per window per instance.
schedule-quantum = 50 milliseconds
schedule-quantum = ${?DKQ_SCHEDULE_QUANTUM}

# How much earlier a request must be to move the schedule timer; requests closer than this coalesce.
schedule-slack = 50 milliseconds
schedule-slack = ${?DKQ_SCHEDULE_SLACK}

# The longest the schedule timer waits with no request. It bounds lateness when the instance that accepted a
# schedule dies with its request in memory: any other instance's backstop moves the message.
schedule-backstop = 60 seconds
schedule-backstop = ${?DKQ_SCHEDULE_BACKSTOP}

# The most scheduled messages one call of the mover moves per partition. A script blocks the whole server, so
# the call is bounded and repeats at once when it hits this.
schedule-limit = 100
schedule-limit = ${?DKQ_SCHEDULE_LIMIT}
