// The message contract: the unit that travels, and the request/response shapes around it.
// The service that carries them is keyed_queue_service.proto; design and rationale: docs/research/phase-1-api.md
syntax = "proto3";

package homelab.keyedqueue.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "scalapb/scalapb.proto";

// Generator options live here rather than in build.sbt so ScalaPB and zio-grpc agree on the package.
option (scalapb.options) = {
  flat_package: true
};


// How `payload` is serialised. UNSPECIFIED is rejected rather than guessed: a receiver that assumes a
// format will one day decode garbage successfully.
enum Encoding {
  ENCODING_UNSPECIFIED = 0;
  ENCODING_JSON        = 1;
  ENCODING_PROTOBUF    = 2;
}

// The unit that travels and is stored. The queue name is NOT in here — it is the address a message was
// sent to, not a property of the message (docs/research/redis-keyed-queue.md §3b).
message Message {
  string                    key          = 1;  // per-key ordering; empty is a key of its own
  // Unique among the messages queued for this key: it is what a discard names, and what makes a repeated
  // enqueue idempotent rather than a second copy. Required.
  string                    message_id   = 2;
  string                    payload_type = 3;  // stable schema name + version, never a class name
  Encoding                  encoding     = 4;
  google.protobuf.Timestamp sent_at      = 5;  // sender clock: metrics, not decisions
  bytes                     payload      = 6;
}

message EnqueueRequest {
  string   queue    = 1;
  Message  message = 2;
}
message EnqueueResponse {
  uint64 key_depth = 1;  // how many messages this key now has queued; a metric, not a decision
}

message DequeueRequest {
  string                   queue     = 1;
  // Named `max_wait` rather than `wait`: on the JVM a field called `wait` collides with Object.wait().
  google.protobuf.Duration max_wait  = 2;  // how long to block; the RPC deadline should exceed it
  // The most messages to claim at once, clamped to the service's ceiling. One is the default and the
  // minimum. A batch is one claim over several of a key's messages, settled individually — not several
  // claims, and not a licence to work them concurrently: the key is what is owned, and its order still
  // holds.
  uint32                   max_batch = 3;
}
message DequeueResponse {
  // The claim, and the handle every settle for these messages names. Empty when nothing became ready in
  // time, which is NOT an error.
  string                    receipt          = 1;
  repeated Delivery         deliveries       = 2;  // producer order; empty when there was no claim
  google.protobuf.Timestamp lease_expires_at = 3;  // when the whole claim lapses unless renewed
  // How many more were queued for this key behind the batch. A lower bound: producers may append while the
  // claim is held, and nothing else may take from it.
  uint32                    backlog_depth    = 4;
}

message Delivery {
  string   message_id = 1;  // what a settle names this message by
  Message  message    = 2;
  uint32   attempt    = 3;  // 1 on first delivery, 2+ after a reclaim
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_DONE        = 1;
  OUTCOME_FAILED      = 2;
}

// Whether a call applied, or found the caller's lease already revoked.
enum Applied {
  APPLIED_UNSPECIFIED = 0;
  APPLIED_OK          = 1;
  APPLIED_STALE       = 2;
}

message SettleRequest {
  string                   receipt     = 1;
  reserved 2, 4;                             // was a single `outcome`, and a `discard_ahead` count
  google.protobuf.Duration retry_after = 3;  // a nack asking the KEY to wait; zero means immediately
  // What became of each message named. A claim may be settled piece by piece: naming some leaves the rest
  // owed, and the claim ends — releasing the key — once nothing is.
  //
  // An id this claim does not own is ignored rather than refused, which is also what makes a retried settle
  // harmless.
  repeated MessageOutcome  outcomes    = 5;
}

// What a consumer did with one message of its batch.
message MessageOutcome {
  string  message_id = 1;
  Outcome outcome    = 2;
}
message SettleResponse {
  Applied applied = 1;
}

message HeartbeatRequest {
  repeated string receipts = 1;  // everything this consumer currently holds; empty is legal
}
message HeartbeatResponse {
  repeated string           stale         = 1;  // of those, the ones it no longer holds
  google.protobuf.Timestamp renewed_until = 2;  // the new deadline for all the rest
}
